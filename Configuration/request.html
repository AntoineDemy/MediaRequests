<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Demander un film ou une série</title>
<style>
  :root {
    --bg: #101010; --panel: #1c1c1e; --panel2: #262628; --text: #f2f2f2; --muted: #9a9aa0;
    --accent: #aa5cc3; --accent2: #00a4dc; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: -0.01em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .user { color: var(--muted); font-size: .9rem; display: flex; gap: 10px; align-items: center; }
  .link { background: none; border: 0; color: var(--accent2); cursor: pointer; padding: 0; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 22px; }
  .login { max-width: 380px; margin: 12vh auto 0; }
  .login h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 6px; }
  input[type=text], input[type=password], input[type=search], textarea {
    width: 100%; background: var(--panel2); border: 1px solid #333; border-radius: 10px;
    padding: 12px 14px; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .btn { background: var(--accent); border: 0; border-radius: 10px; padding: 11px 16px;
    font-weight: 600; cursor: pointer; color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.full { width: 100%; margin-top: 18px; }
  .btn.ghost { background: var(--panel2); color: var(--text); }
  .err { color: var(--bad); font-size: .9rem; margin-top: 12px; min-height: 1.2em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { background: var(--panel); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; color: var(--muted); }
  .tab.active { background: var(--text); color: #111; font-weight: 600; }
  .tab .count { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: .75rem; margin-left: 6px; }
  .search { position: relative; margin-bottom: 18px; }
  .search input { padding-left: 42px; font-size: 1.05rem; height: 50px; }
  .search svg { position: absolute; left: 14px; top: 15px; opacity: .6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .item { background: var(--panel); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .poster { aspect-ratio: 2/3; background: var(--panel2) center/cover no-repeat; position: relative; }
  .poster .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .85rem; padding: 10px; text-align: center; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
    padding: 3px 8px; border-radius: 6px; font-size: .72rem; font-weight: 600; }
  .info { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-weight: 600; font-size: .92rem; line-height: 1.25; }
  .year { color: var(--muted); font-weight: 400; }
  .info .spacer { flex: 1; }
  .action { width: 100%; padding: 9px; font-size: .88rem; text-align: center; text-decoration: none; display: block; border-radius: 9px; }
  .status { padding: 8px; border-radius: 9px; text-align: center; font-size: .85rem; font-weight: 600; background: var(--panel2); }
  .s-Pending { color: var(--warn); } .s-Approved { color: var(--accent2); }
  .s-Denied { color: var(--bad); } .s-Available { color: var(--ok); }
  .avail { background: var(--ok); color: #08130a; }
  .confirm textarea { font-size: .85rem; padding: 8px 10px; min-height: 58px; resize: vertical; }
  .confirm .row { display: flex; gap: 6px; margin-top: 6px; }
  .confirm .row .btn { flex: 1; padding: 8px; font-size: .85rem; }
  .empty { color: var(--muted); text-align: center; padding: 50px 10px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .line { background: var(--panel); border-radius: var(--radius); display: flex; gap: 12px; padding: 10px; align-items: center; }
  .line img, .line .ph { width: 52px; height: 78px; object-fit: cover; border-radius: 6px; background: var(--panel2); flex: none; }
  .line .meta { flex: 1; min-width: 0; }
  .line .meta .sub { color: var(--muted); font-size: .82rem; margin-top: 3px; }
  .line .status { white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: var(--text); color: #111; padding: 12px 18px; border-radius: 10px; font-weight: 600;
    transition: transform .25s; max-width: 90vw; z-index: 10; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--bad); color: #fff; }
  .hidden { display: none !important; }
  .embedded header { display: none; }
  .embedded .wrap { padding-top: 6px; }
  .spinner { width: 26px; height: 26px; border: 3px solid #333; border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Connexion -->
  <section id="loginView" class="hidden">
    <form id="loginForm" class="card login">
      <h2>Connexion</h2>
      <p>Utilise ton compte Jellyfin pour demander un film ou une série.</p>
      <label for="username">Nom d'utilisateur</label>
      <input id="username" type="text" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn full" type="submit" id="loginBtn">Se connecter</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <!-- Application -->
  <section id="appView" class="hidden">
    <header>
      <h1>🎬 <span>Demandes</span></h1>
      <div class="user"><span id="userName"></span><button class="link" id="logoutBtn">Déconnexion</button></div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="search">Rechercher</button>
      <button class="tab" data-tab="mine">Mes demandes<span class="count hidden" id="mineCount"></span></button>
    </div>

    <div id="tab-search">
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Un film ou une série…" autocomplete="off">
      </div>
      <div id="results"><div class="empty">Tape le nom d'un film ou d'une série.<br>Si ce n'est pas encore sur Jellyfin, tu pourras le demander.</div></div>
    </div>

    <div id="tab-mine" class="hidden">
      <div id="mine" class="list"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var IMG = 'https://image.tmdb.org/t/p/w342';
  var STORAGE = 'mediaRequests.auth';
  var STATUS_LABEL = { Pending: '⏳ En attente', Approved: '✅ Acceptée', Denied: '❌ Refusée', Available: '▶ Disponible' };
  var auth = null;
  var lastResults = [];
  var searchTimer = null;
  var searchSeq = 0;

  var $ = function (id) { return document.getElementById(id); };

  // Ouverte depuis le bouton dans Jellyfin : on réutilise la session du client web parent.
  var parentApi = null;
  try {
    if (window.parent !== window && window.parent.ApiClient && window.parent.ApiClient.accessToken()) {
      parentApi = window.parent.ApiClient;
    }
  } catch (e) { parentApi = null; }
  var embedded = !!parentApi;
  if (embedded) document.documentElement.classList.add('embedded');

  function call(fn, fallback) {
    try { var v = fn(); return v == null ? fallback : v; } catch (e) { return fallback; }
  }

  function openInJellyfin(id) {
    var hash = '#/details?id=' + encodeURIComponent(id);
    if (embedded) {
      try { window.parent.__mediaRequestsClose && window.parent.__mediaRequestsClose(); } catch (e) {}
      window.parent.location.hash = hash;
    } else {
      window.location.href = '../web/' + hash;
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-jf]');
    if (!a) return;
    e.preventDefault();
    openInJellyfin(a.getAttribute('data-jf'));
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(msg, bad) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast' + (bad ? ' bad' : ''); }, 3200);
  }

  function store(key, val) {
    try { if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }

  function deviceId() {
    if (embedded) return call(function () { return parentApi.deviceId(); }, 'media-requests');
    var id = load('mediaRequests.deviceId');
    if (!id) { id = 'mr-' + Math.random().toString(36).slice(2) + Date.now().toString(36); store('mediaRequests.deviceId', id); }
    return id;
  }

  function authHeader() {
    var client = embedded ? call(function () { return parentApi.appName(); }, 'Jellyfin Web') : 'Media Requests';
    var device = embedded ? call(function () { return parentApi.deviceName(); }, 'Navigateur') : 'Navigateur';
    var version = embedded ? call(function () { return parentApi.appVersion(); }, '1.0.0') : '1.0.0';
    var h = 'MediaBrowser Client="' + client + '", Device="' + encodeURIComponent(device) +
      '", DeviceId="' + deviceId() + '", Version="' + version + '"';
    if (auth && auth.token) h += ', Token="' + auth.token + '"';
    return h;
  }

  // Les URLs sont relatives à /MediaRequests/Page, donc ça marche aussi avec une "base URL" Jellyfin.
  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Authorization': authHeader() };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (res) {
        if (res.status === 401) { logout(); throw new Error('Session expirée, reconnecte-toi.'); }
        if (res.status === 204) return null;
        return res.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!res.ok) throw new Error((data && (data.message || data.detail || data.title)) || ('Erreur ' + res.status));
          return data;
        });
      });
  }

  // ---------- Auth ----------

  function tryReuseJellyfinSession() {
    // Si l'utilisateur est déjà connecté au client web Jellyfin dans ce navigateur, on réutilise sa session.
    var creds = load('jellyfin_credentials');
    var servers = (creds && creds.Servers) || [];
    for (var i = 0; i < servers.length; i++) {
      if (servers[i].AccessToken && servers[i].UserId) {
        return { token: servers[i].AccessToken, userId: servers[i].UserId, name: '' };
      }
    }
    return null;
  }

  function showLogin() {
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('username').focus();
  }

  function showApp() {
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('userName').textContent = auth.name || '';
    loadMine();
    setTimeout(function () { $('q').focus(); }, 50);
  }

  function logout() {
    auth = null;
    if (embedded) {
      $('appView').classList.remove('hidden');
      $('results').innerHTML = '<div class="empty">Session Jellyfin expirée. Recharge la page.</div>';
      return;
    }
    store(STORAGE, null);
    showLogin();
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn');
    btn.disabled = true;
    $('loginErr').textContent = '';
    auth = null;
    api('../Users/AuthenticateByName', { method: 'POST', body: { Username: $('username').value.trim(), Pw: $('password').value } })
      .then(function (data) {
        auth = { token: data.AccessToken, userId: data.User.Id, name: data.User.Name };
        store(STORAGE, auth);
        $('password').value = '';
        showApp();
      })
      .catch(function () { $('loginErr').textContent = 'Identifiants incorrects.'; })
      .then(function () { btn.disabled = false; });
  });

  $('logoutBtn').addEventListener('click', logout);

  // ---------- Onglets ----------

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
      $('tab-search').classList.toggle('hidden', tab.dataset.tab !== 'search');
      $('tab-mine').classList.toggle('hidden', tab.dataset.tab !== 'mine');
      if (tab.dataset.tab === 'mine') loadMine();
    });
  });

  // ---------- Recherche ----------

  $('q').addEventListener('input', function () {
    clearTimeout(searchTimer);
    var q = this.value.trim();
    if (q.length < 2) {
      $('results').innerHTML = '<div class="empty">Tape le nom d\'un film ou d\'une série.</div>';
      return;
    }
    searchTimer = setTimeout(function () { search(q); }, 350);
  });

  function search(q) {
    var seq = ++searchSeq;
    $('results').innerHTML = '<div class="spinner"></div>';
    api('Search?query=' + encodeURIComponent(q))
      .then(function (data) {
        if (seq !== searchSeq) return;
        lastResults = data || [];
        renderResults();
      })
      .catch(function (err) {
        if (seq !== searchSeq) return;
        $('results').innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
      });
  }

  function renderResults() {
    if (!lastResults.length) {
      $('results').innerHTML = '<div class="empty">Aucun résultat.</div>';
      return;
    }
    $('results').innerHTML = '<div class="grid">' + lastResults.map(card).join('') + '</div>';
  }

  function card(r, i) {
    var poster = r.posterPath
      ? '<div class="poster" style="background-image:url(\'' + IMG + esc(r.posterPath) + '\')">'
      : '<div class="poster"><div class="noimg">' + esc(r.title) + '</div>';
    var action;
    if (r.jellyfinId) {
      action = '<a class="btn action avail" href="#" data-jf="' + esc(r.jellyfinId) + '">▶ Regarder</a>';
    } else if (r.requestStatus) {
      action = '<div class="status s-' + esc(r.requestStatus) + '">' + esc(STATUS_LABEL[r.requestStatus] || r.requestStatus) + '</div>';
    } else if (r._confirm) {
      action = '<div class="confirm">' +
        '<textarea id="note-' + i + '" maxlength="300" placeholder="Un mot pour l\'admin (optionnel)"></textarea>' +
        '<div class="row"><button class="btn ghost" data-cancel="' + i + '">Annuler</button>' +
        '<button class="btn" data-send="' + i + '">Envoyer</button></div></div>';
    } else {
      action = '<button class="btn action" data-ask="' + i + '">Demander</button>';
    }
    return '<div class="item">' + poster +
      '<span class="badge">' + (r.mediaType === 'tv' ? 'Série' : 'Film') + '</span></div>' +
      '<div class="info"><div class="title">' + esc(r.title) +
      (r.year ? ' <span class="year">(' + esc(r.year) + ')</span>' : '') + '</div>' +
      '<div class="spacer"></div>' + action + '</div></div>';
  }

  $('results').addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.ask != null) {
      lastResults.forEach(function (r) { r._confirm = false; });
      lastResults[+t.dataset.ask]._confirm = true;
      renderResults();
      var note = $('note-' + t.dataset.ask);
      if (note) note.focus();
    } else if (t.dataset.cancel != null) {
      lastResults[+t.dataset.cancel]._confirm = false;
      renderResults();
    } else if (t.dataset.send != null) {
      sendRequest(+t.dataset.send, t);
    }
  });

  function sendRequest(i, btn) {
    var r = lastResults[i];
    var note = ($('note-' + i) || {}).value || '';
    btn.disabled = true;
    api('Request', { method: 'POST', body: {
      mediaType: r.mediaType, tmdbId: r.tmdbId, title: r.title, year: r.year, posterPath: r.posterPath, note: note
    } })
      .then(function () {
        r._confirm = false;
        r.requestStatus = 'Pending';
        renderResults();
        toast('Demande envoyée ✔');
        loadMine();
      })
      .catch(function (err) { btn.disabled = false; toast(err.message, true); });
  }

  // ---------- Mes demandes ----------

  function loadMine() {
    api('Mine').then(function (list) {
      list = list || [];
      var pending = list.filter(function (r) { return r.status === 'Pending'; }).length;
      $('mineCount').textContent = pending;
      $('mineCount').classList.toggle('hidden', !pending);
      if (!list.length) {
        $('mine').innerHTML = '<div class="empty">Tu n\'as encore rien demandé.</div>';
        return;
      }
      $('mine').innerHTML = list.map(function (r) {
        var img = r.posterPath ? '<img src="' + IMG + esc(r.posterPath) + '" alt="">' : '<div class="ph"></div>';
        var right = r.status === 'Available' && r.jellyfinId
          ? '<a class="btn action avail" style="width:auto" href="#" data-jf="' + esc(r.jellyfinId) + '">▶ Regarder</a>'
          : '<div class="status s-' + esc(r.status) + '">' + esc(STATUS_LABEL[r.status] || r.status) + '</div>';
        var cancel = r.status === 'Pending'
          ? ' · <button class="link" data-cancel-req="' + esc(r.id) + '">Annuler</button>' : '';
        return '<div class="line">' + img + '<div class="meta"><div class="title">' + esc(r.title) +
          (r.year ? ' <span class="year">(' + esc(r.year) + ')</span>' : '') + '</div>' +
          '<div class="sub">' + (r.mediaType === 'tv' ? 'Série' : 'Film') + ' · ' +
          new Date(r.createdAt).toLocaleDateString('fr-FR') + cancel + '</div></div>' + right + '</div>';
      }).join('');
    }).catch(function () {});
  }

  $('mine').addEventListener('click', function (e) {
    var id = e.target.dataset.cancelReq;
    if (!id) return;
    api('Mine/' + id, { method: 'DELETE' })
      .then(function () { toast('Demande annulée'); loadMine(); })
      .catch(function (err) { toast(err.message, true); });
  });

  // ---------- Démarrage ----------

  auth = embedded
    ? { token: parentApi.accessToken(), userId: call(function () { return parentApi.getCurrentUserId(); }, ''), name: '' }
    : (load(STORAGE) || tryReuseJellyfinSession());
  if (!auth) { showLogin(); return; }

  // Vérifie que le token est toujours valide et récupère le nom.
  api('../Users/Me')
    .then(function (me) {
      auth.name = me.Name;
      auth.userId = me.Id;
      store(STORAGE, auth);
      showApp();
    })
    .catch(function () { logout(); });
})();
</script>
</body>
</html>
